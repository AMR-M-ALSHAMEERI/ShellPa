[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shellpa"
version = "0.3.0"
description = "A safety-conscious cross-platform terminal assistant with deterministic command review."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "AMR-MOHAMMED-ABDULJALIL-ALSHAMEERI"},
]
keywords = [
    "ai-agent",
    "automation",
    "cli",
    "command-line",
    "cross-platform",
    "developer-tools",
    "natural-language",
    "terminal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Shells",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyfiglet>=1.0.2",
    "questionary>=2.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
codex = [
    "openai-codex==0.144.4",
]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.0,<10",
    "ruff>=0.8",
]

[project.scripts]
shellpa = "shellpa.main:app"

[project.urls]
Homepage = "https://github.com/AMR-M-ALSHAMEERI/ShellPa"
Repository = "https://github.com/AMR-M-ALSHAMEERI/ShellPa"
Issues = "https://github.com/AMR-M-ALSHAMEERI/ShellPa/issues"
Changelog = "https://github.com/AMR-M-ALSHAMEERI/ShellPa/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".private", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
packages = ["shellpa"]
mypy_path = "src"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
