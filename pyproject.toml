[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shellpa"
version = "0.1.0"
description = "A cross-platform CLI Agent for performing system tasks via natural language."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyfiglet>=1.0.2",
    "questionary>=2.0.0"
]

[project.scripts]
shellpa = "shellpa.main:app"
