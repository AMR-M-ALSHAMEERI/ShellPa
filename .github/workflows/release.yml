name: Publish package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tools
        run: python -m pip install build twine

      - name: Require a matching version tag for production
        if: inputs.target == 'pypi'
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', pyproject)
          if match is None:
              raise SystemExit("Package version was not found.")
          expected = f"v{match.group(1)}"
          if os.environ["RELEASE_REF_TYPE"] != "tag":
              raise SystemExit("Production publication must run from a Git tag.")
          if os.environ["RELEASE_REF_NAME"] != expected:
              raise SystemExit(
                  f"Production tag must be {expected}, "
                  f"not {os.environ['RELEASE_REF_NAME']}."
              )
          PY

      - name: Build wheel and source archive
        run: python -m build

      - name: Verify package metadata
        run: python -m twine check --strict dist/*

      - name: Verify package contents
        run: python scripts/verify_package_contents.py dist

      - name: Smoke-test the built wheel
        run: |
          python -m venv release-venv
          release-venv/bin/python -m pip install dist/*.whl
          release-venv/bin/shellpa version
          release-venv/bin/shellpa --help

      - name: Store verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/shellpa
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shellpa
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
