name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e ".[dev,codex]"

      - name: Verify embedded Codex runtime
        run: python -c "import openai_codex; print(openai_codex.__version__)"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Audit installed dependencies
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip_audit --local --skip-editable

      - name: Build package
        run: python -m build

      - name: Verify package contents
        run: python scripts/verify_package_contents.py dist
